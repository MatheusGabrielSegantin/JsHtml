<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/estilo.css">
    <title>Calculadora de IMC</title>
  
<script>
    function calcularIMC() {

        var peso = Number(document.querySelector('.peso').value);
        var altura = Number(document.querySelector('.altura').value);

        var imc = peso / (altura * altura);

        if (imc < 18.5) {
            document.querySelector('.mensagem').innerHTML = "Seu IMC é: " + imc + " - Abaixo do peso";
            document.querySelector('.imagem-imc').src = "assets/img/abaixo.png";
        }

        else if (imc < 25) {
            document.querySelector('.mensagem').innerHTML = "Seu IMC é: " + imc + " - Peso normal";
            document.querySelector('.imagem-imc').src = "assets/img/normal.png";
        }

        else if (imc < 30) {
            document.querySelector('.mensagem').innerHTML = "Seu IMC é: " + imc + " - Sobrepeso";
            document.querySelector('.imagem-imc').src = "assets/img/sobrepeso.png";
        }

        else {
            document.querySelector('.mensagem').innerHTML = "Seu IMC é: " + imc + " - Obesidade";
            document.querySelector('.imagem-imc').src = "assets/img/obesidade.png";
        }

        document.querySelector('.imagem-imc').style.display = "block";
    }
</script>



</head>
<body>
    <div class="titulo">
        <h1>Calcule seu IMC</h1>
        <h2>descubra seu índice de massa corporal de forma simples</h2>
    </div>

    <form>
        <fieldset>
            <div class="formulario">
                <legend>Informe seus dados</legend>

                <label>Digite sua altura (m)</label>
                <input type="number" name="altura" placeholder="Ex: 1.75" class="altura">

                <label>Digite seu peso (kg)</label>
                <input type="number" name="peso" placeholder="Ex: 70" class="peso">

                <label>Sexo</label>
                <select name="sexo" class="sexo">
                    <option disabled selected>Selecione uma opção</option>
                    <option value="masculino">Homem</option>
                    <option value="feminino">Mulher</option>
                </select>

                <button type="button" onclick="calcularIMC()" class="botao">Enviar</button> 

                <div class="mensagem"></div>
                <img class="imagem-imc" src="" alt="Resultado IMC">
            </div>
        </fieldset>
    </form> 
</body>
</html>
